# Rime schema settings
# encoding: utf-8

__include: hao_xi.schema.yaml:/

__patch:
  switches/@before 0:
    name: super_tips
    states: [ 提示关, 提示开 ]
    reset: 1

schema:
  schema_id: hao_xi_52p
  name: 邪修・淅码(动态五二顶)
  version: "0.1.0"
  author:
    - 深白
    - 荒
  description: |
    五二顶：二简不打空格，一简打空格上屏，三简、四码打「/」上屏
    动态二重二简：二简的第二个候选是根据你使用的频率变化的，使用 「'+编码」 这种方式输入的字能增加频率

engine:
  processors:
    - lua_processor@*hao.hao_switch*proc@hao
    - lua_processor@*hao.hao_tips
    - ascii_composer
    - lua_processor@*lutai.key_binder
    - key_binder
    - lua_processor@*lutai.popping
    - recognizer
    - lua_processor@*hao.hao_spelling*processor
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
    - lua_processor@*hao.hao_wordscounter
  translators:
    - lua_translator@*hao.hao_switch*tr@hao
    - punct_translator
    - lua_translator@*hao.hao_shijian
    - lua_translator@*hao.hao_number
    - history_translator@history
    - script_translator@hao_pinyin_lookup
    - table_translator@hao_stroke_lookup
    - script_translator
    - lua_translator@*hao.hao_os*os_env_translator
  filters:
    - simplifier@traditionalize
    - simplifier@simplify
    - reverse_lookup_filter@reverse_lookup
    - lua_filter@*hao.hao_spelling*filter
    - lua_filter@*hao.hao_postpone_fullcode
    - lua_filter@*hao.hao_os*lazy_clock_filter
    - lua_filter@*hao.hao_os*preedit_lazy_clock_filter
    - lua_filter@*snow.fix
    - lua_filter@*lutai.postpone
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba;' /
  initials: zyxwvutsrqponmlkjihgfedcba;' /
  delimiter: " "
  max_code_length: 5
  popping:
    - match: "[qwertyuiopasdfghjklzxcvbnm]{4}"
      accept: "[^ 2345789]"
      prefix: 2
  algebra:
    - derive/^'(..).*$/$1/

translator:
  dictionary: hao_xi_52p
  prism: hao_xi_52p
  enable_sentence: false
  enable_user_dict: true
  enable_completion: false
  disable_user_dict_for_patterns:
    - '^.$'
    - '^.{3,4}$'

hao:
  code: hao_xi_52p

key_binder:
  tips_key: "period"
  bindings:
    # 句末一、二码 + 「空格」 → 首选字上屏
    #- match: "^[qwertyuiopasdfghjklzxcvbnm;]{1, 2}$"
    #  accept: " "
    #  send_sequence: " "
    # 句末三码 + 「空格」 → 二简字 + 一简字上屏
    # 句末四码 + 「空格」 → 二简字 + 二简字上屏
    - match: "^[qwertyuiopasdfghjklzxcvbnm;]{3, 4}$"
      accept: " "
      send_sequence: "{Home}{Right}{Right}{space}{space}"

    # 一、二码 + 「；」 → 次选上屏
    - match: "^[qwertyuiopasdfghjklzxcvbnm;]{1, 2}$"
      accept: ";"
      send_sequence: "2"
    # 句末三码 + 「；」 → 二简字 + 一简二重（快符）上屏
    # 句末四码 + 「；」 → 二简字 + 二简二重上屏
    - match: "^[qwertyuiopasdfghjklzxcvbnm;]{3, 4}$"
      accept: ";"
      send_sequence: "{Home}{Right}{Right}{space}2"
    # 二简次选+二简首选
    - match: "^[qwertyuiopasdfghjklzxcvbnm;]{3, 4}$"
      accept: "4"
      send_sequence: "{Home}{Right}{Right}2{space}"
    # 二简次选+二简次选
    - match: "^[qwertyuiopasdfghjklzxcvbnm;]{3, 4}$"
      accept: "7"
      send_sequence: "{Home}{Right}{Right}22"
    
    # 二简次选+三码或四码救急 「输掉」→「ytpd5j/」
    - match: "^[qwertyuiopasdfghjklzxcvbnm;]{3, 4}$"
      accept: "5"
      send_sequence: "{Home}{Right}{Right}2"

    # 快符
    - { match: "^;$", accept: "q", send_sequence: "q{space}" }
    #- { match: "^;$", accept: "w", send_sequence: "w{space}" }
    #- { match: "^;$", accept: "e", send_sequence: "e{space}" }
    #- { match: "^;$", accept: "r", send_sequence: "r{space}" }
    - { match: "^;$", accept: "t", send_sequence: "t{space}" }
    - { match: "^;$", accept: "y", send_sequence: "y{space}" }
    #- { match: "^;$", accept: "u", send_sequence: "u{space}" }
    #- { match: "^;$", accept: "i", send_sequence: "i{space}" }
    #- { match: "^;$", accept: "o", send_sequence: "o{space}" }
    - { match: "^;$", accept: "p", send_sequence: "p{space}" }
    - { match: "^;$", accept: "a", send_sequence: "a{space}" }
    - { match: "^;$", accept: "s", send_sequence: "s{space}" }
    - { match: "^;$", accept: "d", send_sequence: "d{space}" }
    - { match: "^;$", accept: "f", send_sequence: "f{space}" }
    - { match: "^;$", accept: "g", send_sequence: "g{space}" }
    - { match: "^;$", accept: "h", send_sequence: "h{space}" }
    - { match: "^;$", accept: "j", send_sequence: "j{space}" }
    - { match: "^;$", accept: "k", send_sequence: "k{space}" }
    - { match: "^;$", accept: "l", send_sequence: "l{space}" }
    - { match: "^;$", accept: "z", send_sequence: "z{space}" }
    - { match: "^;$", accept: "x", send_sequence: "x{space}" }
    - { match: "^;$", accept: "c", send_sequence: "c{space}" }
    - { match: "^;$", accept: "v", send_sequence: "v{space}" }
    - { match: "^;$", accept: "b", send_sequence: "b{space}" }
    - { match: "^;$", accept: "n", send_sequence: "n{space}" }
    - { match: "^;$", accept: "m", send_sequence: "m{space}" }

    - { when: always, accept: "Control+Shift+J", toggle: simplification }
    - { when: always, accept: "Control+Shift+F", toggle: traditionalization }
    - { when: has_menu, accept: "1", send: KP_1 }
    - { when: has_menu, accept: "/", send: KP_1 }
    - { when: has_menu, accept: apostrophe, send: KP_3 } # 引号三选
    - { when: has_menu, accept: Tab, send: KP_2 } # 製表符次选
    - { when: has_menu, accept: minus, send: Page_Up } # 減號上翻頁
    - { when: has_menu, accept: equal, send: Page_Down } # 等號下翻頁
    - { when: composing, accept: "Control+d", send: Delete }
    - { when: composing, accept: "Control+k", send: "Shift+Delete" }

reverse_lookup:
  dictionary: hao_xi_52p

menu:
  alternative_select_keys: "_2389"
  alternative_select_labels: [ １, ２, ３, ８, ９ ]
  page_size: 5
